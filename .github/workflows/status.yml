name: Monitor and publish status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/status.yml
      - scripts/**
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Monitor ID to fail for a controlled incident test"
        required: false
        type: choice
        options:
          - none
          - website
          - platform
          - tenant
          - wazzap
          - discord-guard
          - discord-worker

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: clubs-manager-status
  cancel-in-progress: false

jobs:
  monitor:
    name: Check services and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out status configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run production checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_FORCE_FAILURE: ${{ inputs.force_failure || 'none' }}
        run: |
          node --test scripts/*.test.mjs
          node scripts/monitor.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload status page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Publish status page
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
